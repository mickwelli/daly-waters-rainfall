name: Daily Rainfall Update

on:
  schedule:
    - cron: '0 21 * * *'  # Runs at 21:00 UTC (7:00 AM ACST)
  workflow_dispatch:      # Allows run manually with a button click

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install Dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr", "lubridate", "httr", "readr"))'

      - name: Run Data Script
        run: Rscript examples/GetDWRainData.R

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data/Rain_DW.rds
          git commit -m "Auto-update rainfall data: $(date +'%Y-%m-%d')" || exit 0
          git push
