name: Deploy to Shinyapps.io

on:
  push:
    branches: [ main ] # This triggers the deploy whenever you push to the main branch

jobs:
  shiny-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Speeds up package installation

      - name: Install Dependencies
        run: |
          Rscript -e 'install.packages(c("rsconnect", "shiny", "dplyr", "ggplot2", "ggiraph", "reactable", "lubridate", "tidyr"))'

      - name: Authorize and Deploy
        run: |
          Rscript -e "rsconnect::setAccountInfo(name='${{ secrets.SHINYAPPS_ACCOUNT }}', token='${{ secrets.SHINYAPPS_TOKEN }}', secret='${{ secrets.SHINYAPPS_SECRET }}')"
          Rscript -e "rsconnect::deployApp(appName='daly-waters-rainfall')"
